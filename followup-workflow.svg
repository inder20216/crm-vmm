<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 L2,4.5 Z" fill="#475569"/>
    </marker>
    <marker id="arrDash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 L2,4.5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1120" height="1110" fill="#ffffff"/>

  <!-- Title -->
  <text x="560" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Follow-Up Complaint Workflow</text>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#64748b">What happens when an agent opens and works a case in the Follow-up page</text>

  <!-- Legend -->
  <line x1="820" y1="30" x2="858" y2="30" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>
  <text x="866" y="33" font-size="12" fill="#64748b">Data fetch (GET)</text>
  <line x1="820" y1="52" x2="858" y2="52" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="866" y="55" font-size="12" fill="#64748b">Action (UI)</text>

  <!-- S1 -->
  <rect x="170" y="90" width="520" height="40" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">1 · Follow-up Page opens</text>
  <line x1="430" y1="130" x2="430" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- S2 -->
  <rect x="170" y="170" width="520" height="64" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="430" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">2 · Fetch open complaints</text>
  <text x="430" y="217" text-anchor="middle" font-size="12" fill="#64748b">PHP: vmm-followup-complaints  ·  latest status ≠ Closed</text>
  <line x1="690" y1="202" x2="728" y2="202" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>
  <line x1="430" y1="234" x2="430" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- R2 -->
  <rect x="730" y="170" width="330" height="64" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="895" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">GET delay reasons</text>
  <text x="895" y="217" text-anchor="middle" font-size="12" fill="#64748b">PHP: vmm-sp-delay-reasons, else fallback list</text>

  <!-- S3 -->
  <rect x="170" y="274" width="520" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="299" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">3 · Filter &amp; search the list</text>
  <text x="430" y="319" text-anchor="middle" font-size="12" fill="#64748b">Tabs: All · Overdue · Due Today · NC   +   search box</text>
  <line x1="430" y1="330" x2="430" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- S4 -->
  <rect x="170" y="370" width="520" height="40" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="395" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">4 · Select a complaint</text>
  <line x1="430" y1="410" x2="430" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- S5 -->
  <rect x="170" y="450" width="520" height="64" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="430" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">5 · Case history loads</text>
  <text x="430" y="497" text-anchor="middle" font-size="12" fill="#64748b">PHP: vmm-complaint-detail → shows log table</text>
  <line x1="690" y1="482" x2="728" y2="482" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="514" x2="430" y2="586" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- R5 -->
  <rect x="730" y="450" width="330" height="64" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="895" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Follow-up method</text>
  <text x="895" y="497" text-anchor="middle" font-size="12" fill="#64748b">Call · Email Reply · Vendor Update</text>

  <!-- S6 -->
  <rect x="170" y="588" width="520" height="96" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="616" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">6 · Choose status action</text>
  <text x="430" y="640" text-anchor="middle" font-size="12" fill="#334155">Closed / Resolved · Partially Closed · Escalated</text>
  <text x="430" y="660" text-anchor="middle" font-size="12" fill="#334155">Update EDC · Not Connected · Add Note Only</text>
  <line x1="430" y1="684" x2="430" y2="722" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- S7 -->
  <rect x="170" y="724" width="520" height="86" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="750" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">7 · Delay reason (Main + Sub) =&gt; EDC auto-fill</text>
  <text x="430" y="772" text-anchor="middle" font-size="12" fill="#334155">EDC = today + reason TAT</text>
  <text x="430" y="792" text-anchor="middle" font-size="12" fill="#334155">Payment under process → next cycle: 7 · 14 · 21 · 28</text>
  <line x1="690" y1="767" x2="728" y2="767" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="810" x2="430" y2="848" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- R7 -->
  <rect x="730" y="724" width="330" height="86" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="895" y="750" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Validation rules</text>
  <text x="895" y="772" text-anchor="middle" font-size="12" fill="#92400e">Not Connected → Call only, EDC = today + 3</text>
  <text x="895" y="792" text-anchor="middle" font-size="12" fill="#92400e">Closed → date = today; closed-by required; remarks optional</text>

  <!-- S8 -->
  <rect x="170" y="850" width="520" height="118" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="878" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">8 · Submit to server</text>
  <text x="430" y="902" text-anchor="middle" font-size="12" fill="#166534">PHP vmm-close-complaint → Closed · Partially Closed · Escalated</text>
  <text x="430" y="922" text-anchor="middle" font-size="12" fill="#166534">PHP vmm-update-edc → Update EDC</text>
  <text x="430" y="942" text-anchor="middle" font-size="12" fill="#166534">PHP vmm-not-connected → Not Connected</text>
  <text x="430" y="962" text-anchor="middle" font-size="12" fill="#166534">n8n vmm-email-log-activity → Add Note</text>
  <line x1="430" y1="968" x2="280" y2="1000" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="968" x2="780" y2="1000" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Outcome A -->
  <rect x="90" y="1004" width="420" height="80" rx="9" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="1030" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Closed / Resolved</text>
  <text x="300" y="1051" text-anchor="middle" font-size="12" fill="#334155">Closure email sent via Graph API</text>
  <text x="300" y="1070" text-anchor="middle" font-size="12" fill="#334155">Case removed from the list</text>

  <!-- Outcome B -->
  <rect x="610" y="1004" width="420" height="80" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="820" y="1030" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Partially Closed · Escalated · EDC · NC · Note</text>
  <text x="820" y="1051" text-anchor="middle" font-size="12" fill="#334155">Case stays in list</text>
  <text x="820" y="1070" text-anchor="middle" font-size="12" fill="#334155">Case history (logs) reloaded → back to step 5</text>

  <!-- Footnote -->
  <text x="560" y="1096" text-anchor="middle" font-size="11" fill="#94a3b8">Dashed borders = backend data call  ·  Solid = agent interaction  ·  Live site currently served by n8n; planned PHP migration not yet live</text>
</svg>